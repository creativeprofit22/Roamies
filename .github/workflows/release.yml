# Release: tag a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run it by hand.
# Builds a signed + notarized macOS DMG (Apple silicon and Intel) and a Windows installer, then attaches
# them to a draft GitHub release for you to review and publish. The Windows installer ships the Rust voice
# helper with the Moonshine runtime, MSVC runtime and licences (the model downloads on first enable), and
# is installed silently and smoke-tested before upload.
# Each build also uploads a signed update bundle; the manifest job writes latest.json, the feed the
# in-app updater reads from the newest published release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-rs -> target
            showcase/tauri/src-tauri/voice-win -> target
          key: ${{ matrix.target }}

      # Moonshine runtime + CRT (bundled by tauri.windows.conf.json) and the small model for the smoke test.
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: |
            showcase/tauri/src-tauri/voice-rs/models/moonshine-runtime
            showcase/tauri/src-tauri/voice-rs/models/moonshine-small
          key: moonshine-small-${{ hashFiles('showcase/tauri/src-tauri/voice-rs/fetch-moonshine.sh') }}

      - name: Fetch Moonshine
        if: runner.os == 'Windows'
        run: bash src-tauri/voice-rs/fetch-moonshine.sh small

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Developer ID certificate into a throwaway keychain (removed at the end of the job).
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"

      # build.sh copies the web files, bundles the sidecar, then runs `cargo tauri build`. On macOS, Tauri
      # signs with APPLE_SIGNING_IDENTITY and notarizes with APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID.
      - name: Build, sign and notarize
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          # Tauri skips the Finder layout step (background, icon spots) when CI=true; Actions runners can run it.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # Signs the update bundles (minisign); the public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./build.sh release --target ${{ matrix.target }}

      - name: Check the signature and notarization
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose "$APP"
          # The installer window layout lives in .DS_Store; without it the DMG opens as a plain folder.
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MNT" "$DMG" >/dev/null
          ls -la "$MNT"
          ok=1
          for f in .DS_Store .background/background.tiff Applications; do [ -e "$MNT/$f" ] || { echo "::error::DMG is missing $f"; ok=0; }; done
          hdiutil detach -quiet "$MNT"
          [ $ok -eq 1 ]

      # Install the NSIS setup silently, check the voice files landed next to the app, then run the installed
      # helper with its default engine and bundled runtime on a test clip; it must produce a final.
      - name: Install and smoke test the Windows installer
        if: runner.os == 'Windows'
        run: |
          SETUP=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | head -1)
          DEST="$RUNNER_TEMP\smoke"
          powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$SETUP")' -ArgumentList '/S','/D=$DEST'"
          D=$(cygpath -u "$DEST")
          ls -la "$D"
          for f in roamies.exe roamies-voice-moonshine.exe roamies-voice-parakeet.exe node.exe moonshine.dll onnxruntime.dll vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll; do
            [ -s "$D/$f" ] || { echo "::error::installer is missing $f"; exit 1; }
          done
          [ -n "$(ls "$D/licenses/moonshine")" ] || { echo "::error::installer is missing the Moonshine licences"; exit 1; }
          out=$("$D/roamies-voice-moonshine.exe" --wav src-tauri/voice-rs/tests/fixtures/en-short.wav --model-dir src-tauri/voice-rs/models/moonshine-small)
          echo "$out"
          echo "$out" | grep '"type":"final"' | grep -q nightfall || { echo "::error::installed helper produced no final"; exit 1; }

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Roamies $TAG" --generate-notes || true
          shopt -s nullglob
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          files=($B/dmg/*.dmg $B/nsis/*-setup.exe)
          [ ${#files[@]} -gt 0 ] || { echo "No installers were built"; exit 1; }
          # Update bundles: both Macs produce Roamies.app.tar.gz, so name them per architecture.
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$RUNNER_OS" = macOS ]; then
            ARCH=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
            [ -f $B/macos/Roamies.app.tar.gz.sig ] || { echo "::error::No signed update bundle was built"; exit 1; }
            cp $B/macos/Roamies.app.tar.gz "Roamies_${VER}_${ARCH}.app.tar.gz"
            cp $B/macos/Roamies.app.tar.gz.sig "Roamies_${VER}_${ARCH}.app.tar.gz.sig"
            files+=("Roamies_${VER}_${ARCH}.app.tar.gz" "Roamies_${VER}_${ARCH}.app.tar.gz.sig")
          else
            sigs=($B/nsis/*-setup.exe.sig)
            [ ${#sigs[@]} -gt 0 ] || { echo "::error::No signed update installer was built"; exit 1; }
            files+=("${sigs[@]}")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Write latest.json for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./showcase/tauri/src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_NAME}"; [[ "$TAG" == v* ]] || TAG="v$VER"
          mkdir -p sigs && gh release download "$TAG" -p '*.sig' -D sigs
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          VER="$VER" URL="$URL" node -e '
            const fs = require("fs"), { VER, URL } = process.env;
            const sig = (f) => fs.readFileSync("sigs/" + f, "utf8").trim();
            const platforms = {
              "darwin-aarch64": `Roamies_${VER}_aarch64.app.tar.gz`,
              "darwin-x86_64": `Roamies_${VER}_x64.app.tar.gz`,
              "windows-x86_64": `Roamies_${VER}_x64-setup.exe`,
            };
            const out = { version: VER, notes: `Roamies ${VER}`, pub_date: new Date().toISOString(), platforms: {} };
            for (const [k, f] of Object.entries(platforms)) out.platforms[k] = { signature: sig(f + ".sig"), url: `${URL}/${f}` };
            fs.writeFileSync("latest.json", JSON.stringify(out, null, 2));
          '
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
