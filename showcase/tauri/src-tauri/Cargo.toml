[package]
name = "roamies"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "macos-private-api"] }
serde_json = "=1.0.154"
global-hotkey = "=0.9.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.1"
arboard = "=3.7.0"
enigo = "=0.6.1"
# Shared with the Windows voice helpers: the `metrics` shape and word scoring.
roamies-voice-core = { path = "voice-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
