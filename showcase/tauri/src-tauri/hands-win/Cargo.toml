# Screen helper for Roamies on Windows (the twin of hands/main.swift on macOS): lists windows, captures one,
# reads its controls through UI Automation and finds on-screen text. Built by build.rs and bundled as
# binaries/roamies-hands-<target>.exe. The pure parts (ranking, budgets, targets, hands-off) build and test
# on any system; the binary itself answers only on Windows.
[package]
name = "roamies-hands"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "roamies-hands"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"

# Renamed so it doesn't clash with this crate's own `windows` module (window listing).
[target.'cfg(windows)'.dependencies]
w32 = { package = "windows", version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Standalone: not part of the Tauri app's build.
[workspace]
